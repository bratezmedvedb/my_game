<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N5 — ТВ Тренажёр</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card-bg: #ffffff;
      --text: #2c2c2a;
      --sub-text: #6b6a63;
      --kana: #858379;
      --border: #d3d1c7;
      --border-light: #e5e2d8;
      --accent: #d97757;
      --accent-hover: #c46445;
      --ink: #3c3489;
      --success-bg: #eaf3de;
      --success-border: #97c459;
      --star-color: #d97706;
      --star-bg: #fef3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Меню */
    header {
      width: 100%;
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .badge-n5 {
      background: var(--accent);
      color: white;
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      color: var(--sub-text);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* Главная область */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 25px;
      position: relative;
    }

    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
      animation: fadeIn 0.25s ease;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* КАРТОЧКА */
    .presentation-card {
      width: 96vw;
      max-width: 1440px;
      min-height: 74vh;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 30px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .card-top {
      position: absolute;
      top: 24px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }

    .card-top * {
      pointer-events: auto;
    }

    .deck-indicator {
      font-size: 0.95rem;
      color: var(--sub-text);
      font-weight: 600;
    }

    .corner-actions {
      display: flex;
      gap: 8px;
    }

    .action-circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .action-circle-btn:hover {
      transform: scale(1.12);
      border-color: var(--text);
    }

    .action-circle-btn.btn-voice:hover {
      background: #eef2ff;
      border-color: var(--ink);
    }

    .action-circle-btn.btn-star.starred {
      background: var(--star-bg);
      border-color: var(--star-color);
      color: var(--star-color);
    }

    .action-circle-btn.btn-check:hover {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #3b7c1e;
    }

    .action-circle-btn.btn-esc {
      display: none;
      font-weight: bold;
      color: var(--sub-text);
    }

    .action-circle-btn.btn-esc:hover {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
    }

    /* БЛОК ТЕКСТА ПО ЦЕНТРУ */
    .card-center {
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0 20px;
    }

    /* 1. БАЗОВЫЙ РАЗМЕР (1-3 СИМВОЛА) */
    .kanji-display {
      font-size: clamp(6.5rem, 15vw, 13.5rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      letter-spacing: 0 !important;
      margin: 0 0 16px 0;
      text-align: center;
      white-space: nowrap; /* Не переносить строку */
      max-width: 95vw;
    }

    .reading-display {
      font-size: clamp(2.6rem, 5.5vw, 4.6rem);
      color: var(--kana);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0 !important;
      margin: 0 0 16px 0;
      text-align: center;
      white-space: nowrap;
      max-width: 95vw;
    }

    /* 2. АДАПТАЦИЯ: 4 СИМВОЛА */
    .kanji-display.len-4 {
      font-size: clamp(5rem, 11vw, 9.8rem);
      margin-bottom: 12px;
    }

    /* 3. АДАПТАЦИЯ: 5 СИМВОЛОВ */
    .kanji-display.len-5 {
      font-size: clamp(4rem, 8.8vw, 7.8rem);
      margin-bottom: 10px;
    }

    /* 4. АДАПТАЦИЯ: 6+ СИМВОЛОВ (ДЛИННЫЕ СЛОВА) */
    .kanji-display.len-long {
      font-size: clamp(3rem, 6.8vw, 6rem);
      margin-bottom: 8px;
    }

    .reading-display.len-long {
      font-size: clamp(1.8rem, 3.8vw, 3.2rem);
      margin-bottom: 10px;
    }

    /* ПЕРЕВОД */
    .meaning-display {
      font-size: clamp(0.95rem, 1.8vw, 1.4rem);
      color: var(--ink);
      font-weight: 600;
      display: inline-block;
      border: none !important;
      background: transparent !important;
      padding: 4px 12px;
      margin: 0;
      text-align: center;
      transition: filter 0.25s ease, opacity 0.25s ease;
      max-width: 90vw;
    }

    .meaning-display.hidden-answer {
      filter: blur(8px);
      opacity: 0.15;
    }

    /* НИЖНЯЯ ПАНЕЛЬ */
    .bottom-bar {
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-light);
      padding: 14px 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .ctrl-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      border-color: var(--text);
      background: #eae6dc;
    }

    .ctrl-btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .ctrl-btn.primary:hover {
      background: var(--accent-hover);
    }

    .ctrl-btn.active-toggle {
      background: #eef2ff;
      border-color: var(--ink);
      color: var(--ink);
    }

    .select-custom {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .progress-line-container {
      position: absolute;
      top: -3px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--border-light);
    }

    .progress-line {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.05s linear;
    }

    /* =========================================================
       РЕЖИМ НА ВЕСЬ ЭКРАН (16:9 FULLSCREEN ДЛЯ ТВ)
       ========================================================= */
    :fullscreen header,
    :fullscreen .bottom-bar,
    :fullscreen .deck-indicator {
      display: none !important;
    }

    :fullscreen body {
      background: var(--bg);
    }

    :fullscreen main {
      padding: 0;
      width: 100vw;
      height: 100vh;
    }

    :fullscreen .presentation-card {
      width: 100vw;
      height: 100vh;
      max-width: none;
      min-height: 100vh;
      border: none;
      border-radius: 0;
      background: var(--bg);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    :fullscreen .card-top {
      top: 36px;
      left: 48px;
      right: 48px;
    }

    :fullscreen .action-circle-btn.btn-esc {
      display: flex;
    }

    /* МАСШТАБЫ FULLSCREEN С УЧЕТОМ ДЛИНЫ СЛОВА */
    :fullscreen .kanji-display {
      font-size: clamp(12rem, 26vw, 24rem);
      margin-bottom: 24px;
    }
    :fullscreen .kanji-display.len-4 {
      font-size: clamp(8.5rem, 18vw, 16.5rem);
      margin-bottom: 18px;
    }
    :fullscreen .kanji-display.len-5 {
      font-size: clamp(7rem, 14vw, 13rem);
      margin-bottom: 16px;
    }
    :fullscreen .kanji-display.len-long {
      font-size: clamp(4.8rem, 10.5vw, 9.8rem);
      margin-bottom: 14px;
    }

    :fullscreen .reading-display {
      font-size: clamp(4.5rem, 10vw, 9rem);
      margin-bottom: 24px;
    }
    :fullscreen .reading-display.len-long {
      font-size: clamp(2.8rem, 6vw, 5.2rem);
      margin-bottom: 16px;
    }

    :fullscreen .meaning-display {
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
    }

    /* Списки во вкладках */
    .list-wrapper {
      width: 96vw;
      max-width: 1440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      max-height: 78vh;
      display: flex;
      flex-direction: column;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 14px;
    }

    .search-input {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      font-size: 1rem;
      min-width: 280px;
    }

    .words-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .word-item {
      background: var(--bg);
      border: 1px solid var(--border-light);
      padding: 14px 18px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-item .main-info .w-kanji {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--text);
    }

    .word-item .main-info .w-reading {
      font-size: 1rem;
      color: var(--sub-text);
      margin-left: 8px;
    }

    .word-item .main-info .w-meaning {
      font-size: 0.95rem;
      color: var(--ink);
      margin-top: 4px;
      font-weight: 500;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .mini-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-btn:hover {
      background: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--sub-text);
      font-size: 1.15rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-content {
      animation: fadeIn 0.2s ease forwards;
    }
  </style>
</head>
<body>

  <!-- Меню -->
  <header>
    <div class="brand">
      <span>日本語 JLPT N5</span>
      <span class="badge-n5">795 Слов</span>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('presentation')">📺 Презентация</button>
      <button class="nav-btn" id="favTabBtn" onclick="switchTab('favorites')">⭐ Избранные (0)</button>
      <button class="nav-btn" id="learnedTabBtn" onclick="switchTab('learned')">✔️ Изученные (0)</button>
      <button class="nav-btn" onclick="switchTab('all')">📚 Все 795 слов</button>
    </div>
  </header>

  <!-- Экран -->
  <main>
    <div id="tab-presentation" class="tab-content active">
      <div class="presentation-card">
        
        <div class="card-top">
          <div class="deck-indicator" id="deckIndicator">Слово 1 из 795</div>
          
          <div class="corner-actions">
            <button class="action-circle-btn btn-star" id="starActionBtn" onclick="toggleCurrentFavorite()" title="В избранное / Доучить (S)">
              ⭐
            </button>
            <button class="action-circle-btn btn-voice" onclick="speakCurrentWord(true)" title="Озвучить Kyoko (V)">
              🔊
            </button>
            <button class="action-circle-btn btn-check" onclick="markCurrentAsLearned()" title="Знаю слово (Enter или K)">
              ✔️
            </button>
            <button class="action-circle-btn btn-esc" onclick="toggleFullScreen()" title="Выйти из полного экрана (ESC / F)">
              ✕
            </button>
          </div>
        </div>

        <div class="card-center" onclick="toggleHideAnswer()">
          <div class="kanji-display" id="dispKanji">大きい</div>
          <div class="reading-display" id="dispReading">おおきい</div>
          <div>
            <div class="meaning-display" id="dispMeaning">большой</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Вкладка: Избранные -->
    <div id="tab-favorites" class="tab-content">
      <div class="list-wrapper">
        <div class="list-header">
          <div>
            <h2>⭐ Избранные слова</h2>
            <p style="color:var(--sub-text); font-size:0.95rem;">Слова, добавленные для повторения</p>
          </div>
          <button class="ctrl-btn primary" onclick="startDeckMode('favorites')">▶ Запустить презентацию из избранных</button>
        </div>
        <div class="words-grid" id="favoritesGrid"></div>
      </div>
    </div>

    <!-- Вкладка: Изученные -->
    <div id="tab-learned" class="tab-content">
      <div class="list-wrapper">
        <div class="list-header">
          <div>
            <h2>✔️ Изученные слова</h2>
            <p style="color:var(--sub-text); font-size:0.95rem;">Исключены из основного показа</p>
          </div>
          <button class="ctrl-btn" onclick="resetAllLearned()">Вернуть все в колоду</button>
        </div>
        <div class="words-grid" id="learnedGrid"></div>
      </div>
    </div>

    <!-- Вкладка: Все слова -->
    <div id="tab-all" class="tab-content">
      <div class="list-wrapper">
        <div class="list-header">
          <div>
            <h2>📚 Полный словарь (795 слов)</h2>
            <p style="color:var(--sub-text); font-size:0.95rem;" id="allWordsCount">Всего: 795 слов</p>
          </div>
          <input type="text" class="search-input" id="searchAllInput" placeholder="Поиск по кандзи, чтению или смыслу..." oninput="filterAllWords()">
        </div>
        <div class="words-grid" id="allWordsGrid"></div>
      </div>
    </div>
  </main>

  <!-- Панель управления -->
  <div class="bottom-bar">
    <div class="progress-line-container">
      <div class="progress-line" id="progressLine"></div>
    </div>

    <button class="ctrl-btn" onclick="prevSlide()" title="Стрелка влево">◀ Назад</button>
    <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">⏸ Пауза</button>
    <button class="ctrl-btn" onclick="nextSlide()" title="Стрелка вправо">Вперёд ▶</button>
    
    <select class="select-custom" id="timerSelect" onchange="changeInterval()">
      <option value="3000">3 сек</option>
      <option value="5000" selected>5 сек</option>
      <option value="8000">8 сек</option>
      <option value="10000">10 сек</option>
      <option value="15000">15 сек</option>
      <option value="30000">30 сек</option>
      <option value="45000">45 сек</option>
    </select>

    <button class="ctrl-btn active-toggle" id="autoVoiceBtn" onclick="toggleAutoVoice()" title="Клавиша A">
      🔊 Автоозвучка: ВКЛ
    </button>

    <button class="ctrl-btn" onclick="toggleHideAnswer()" title="Клавиша H">👁 Ответ</button>
    <button class="ctrl-btn" onclick="shuffleCurrentDeck()">🔀 Перемешать</button>
    <button class="ctrl-btn" onclick="toggleFullScreen()" title="Клавиша F">⛶ Экран (16:9)</button>
  </div>

      dispKanji.classList.remove('fade-content');
      void dispKanji.offsetWidth;
      dispKanji.classList.add('fade-content');

      dispKanji.textContent = item.k;
      dispReading.textContent = item.r;
      dispMeaning.textContent = item.m;

      // ДИНАМИЧЕСКИЙ АВТОМАСШТАБ ПО КОЛИЧЕСТВУ СИМВОЛОВ
      const kLen = item.k.length;
      const rLen = item.r.length;

      dispKanji.classList.remove('len-4', 'len-5', 'len-long');
      dispReading.classList.remove('len-long');

      if (kLen === 4) {
        dispKanji.classList.add('len-4');
      } else if (kLen === 5) {
        dispKanji.classList.add('len-5');
      } else if (kLen >= 6) {
        dispKanji.classList.add('len-long');
      }

      if (rLen >= 8) {
        dispReading.classList.add('len-long');
      }

      deckIndicator.textContent = `Слово ${currentIndex + 1} из ${activeDeck.length}`;

      if (starredSet.has(item.id)) {
        starActionBtn.classList.add('starred');
      } else {
        starActionBtn.classList.remove('starred');
      }

      if (isAutoVoice) {
        speakCurrentWord(false);
      }

      resetProgress();
    }

    function getKyokoVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      
      let voice = voices.find(v => 
        v.name.toLowerCase().includes('kyoko') || 
        v.name.includes('キョウコ') ||
        v.name.includes('Kyoko')
      );
      
      if (!voice) {
        voice = voices.find(v => v.lang.startsWith('ja') || v.lang === 'ja_JP');
      }
      return voice;
    }

    function speakCurrentWord(userTriggered = false) {
      if (activeDeck.length === 0 || !('speechSynthesis' in window)) return;
      const item = activeDeck[currentIndex];

      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(item.r || item.k);
      ut.lang = 'ja-JP';

      const voice = getKyokoVoice();
      if (voice) ut.voice = voice;
      ut.rate = 0.9;

      window.speechSynthesis.speak(ut);
    }

    function toggleAutoVoice() {
      isAutoVoice = !isAutoVoice;
      if (isAutoVoice) {
        autoVoiceBtn.textContent = '🔊 Автоозвучка: ВКЛ';
        autoVoiceBtn.classList.add('active-toggle');
        speakCurrentWord(true);
      } else {
        autoVoiceBtn.textContent = '🔇 Автоозвучка: ВЫКЛ';
        autoVoiceBtn.classList.remove('active-toggle');
        window.speechSynthesis.cancel();
      }
    }

    function toggleCurrentFavorite() {
      if (activeDeck.length === 0) return;
      const item = activeDeck[currentIndex];
      if (starredSet.has(item.id)) {
        starredSet.delete(item.id);
        starActionBtn.classList.remove('starred');
      } else {
        starredSet.add(item.id);
        starActionBtn.classList.add('starred');
      }
      saveStorage();
      renderFavoritesList();
    }

    function markCurrentAsLearned() {
      if (activeDeck.length === 0) return;
      const item = activeDeck[currentIndex];
      
      learnedSet.add(item.id);
      saveStorage();
      renderLearnedList();
      rebuildDeck();
    }

    function nextSlide() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex + 1) % activeDeck.length;
      updateCard();
    }

    function prevSlide() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex - 1 + activeDeck.length) % activeDeck.length;
      updateCard();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.textContent = '⏸ Пауза';
        playBtn.classList.add('primary');
        startTimer();
      } else {
        playBtn.textContent = '▶ Старт';
        playBtn.classList.remove('primary');
        stopTimer();
      }
    }

    function startTimer() {
      stopTimer();
      if (!isPlaying || activeDeck.length === 0) return;

      let start = performance.now();
      progressTimer = setInterval(() => {
        let elapsed = performance.now() - start;
        let p = Math.min((elapsed / slideInterval) * 100, 100);
        progressLine.style.width = p + '%';
      }, 50);

      timer = setTimeout(() => {
        nextSlide();
        startTimer();
      }, slideInterval);
    }

    function stopTimer() {
      clearTimeout(timer);
      clearInterval(progressTimer);
      progressLine.style.width = '0%';
    }

    function resetProgress() {
      if (isPlaying) startTimer();
    }

    function changeInterval() {
      slideInterval = parseInt(document.getElementById('timerSelect').value);
      if (isPlaying) startTimer();
    }

    function toggleHideAnswer() {
      isAnswerHidden = !isAnswerHidden;
      dispMeaning.classList.toggle('hidden-answer', isAnswerHidden);
    }

    function shuffleCurrentDeck() {
      activeDeck.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      updateCard();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.add('active');

      const btnMap = {
        'presentation': 0,
        'favorites': 1,
        'learned': 2,
        'all': 3
      };
      document.querySelectorAll('.nav-btn')[btnMap[tabId]]?.classList.add('active');

      if (tabId === 'favorites') renderFavoritesList();
      if (tabId === 'learned') renderLearnedList();
      if (tabId === 'all') renderAllWordsList();
    }

    function startDeckMode(mode) {
      currentDeckMode = mode;
      currentIndex = 0;
      switchTab('presentation');
      rebuildDeck();
    }

    function renderFavoritesList() {
      const grid = document.getElementById('favoritesGrid');
      grid.innerHTML = '';
      const favWords = RAW_VOCABULARY.filter(w => starredSet.has(w.id));

      if (favWords.length === 0) {
        grid.innerHTML = '<div class="empty-state">В избранном пока нет слов. Нажмите ⭐ на карточке.</div>';
        return;
      }

      favWords.forEach(w => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `
          <div class="main-info">
            <div><span class="w-kanji">${w.k}</span><span class="w-reading">${w.r}</span></div>
            <div class="w-meaning">${w.m}</div>
          </div>
          <div class="item-actions">
            <button class="mini-btn" onclick="speakWordText('${w.r}')">🔊</button>
            <button class="mini-btn" onclick="removeFavorite(${w.id})">❌</button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function removeFavorite(id) {
      starredSet.delete(id);
      saveStorage();
      renderFavoritesList();
      if (currentDeckMode === 'favorites') rebuildDeck();
    }

    function renderLearnedList() {
      const grid = document.getElementById('learnedGrid');
      grid.innerHTML = '';
      const learnedWords = RAW_VOCABULARY.filter(w => learnedSet.has(w.id));

      if (learnedWords.length === 0) {
        grid.innerHTML = '<div class="empty-state">Нет изученных слов.</div>';
        return;
      }

      learnedWords.forEach(w => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `
          <div class="main-info">
            <div><span class="w-kanji">${w.k}</span><span class="w-reading">${w.r}</span></div>
            <div class="w-meaning">${w.m}</div>
          </div>
          <div class="item-actions">
            <button class="mini-btn" onclick="unlearnWord(${w.id})" title="Вернуть в колоду">↩️</button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function unlearnWord(id) {
      learnedSet.delete(id);
      saveStorage();
      renderLearnedList();
      if (currentDeckMode === 'normal') rebuildDeck();
    }

    function resetAllLearned() {
      if (confirm('Вернуть все изученные слова обратно в колоду?')) {
        learnedSet.clear();
        saveStorage();
        renderLearnedList();
        rebuildDeck();
      }
    }

    function renderAllWordsList(query = '') {
      const grid = document.getElementById('allWordsGrid');
      grid.innerHTML = '';
      document.getElementById('allWordsCount').textContent = `Всего: ${RAW_VOCABULARY.length} слов`;

      const filtered = RAW_VOCABULARY.filter(w => {
        const q = query.toLowerCase();
        return w.k.toLowerCase().includes(q) || w.r.toLowerCase().includes(q) || w.m.toLowerCase().includes(q);
      });

      filtered.forEach(w => {
        const isFav = starredSet.has(w.id);
        const isLrn = learnedSet.has(w.id);

        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `
          <div class="main-info">
            <div>
              <span class="w-kanji">${w.k}</span>
              <span class="w-reading">${w.r}</span>
              ${isFav ? '⭐' : ''} ${isLrn ? '✔️' : ''}
            </div>
            <div class="w-meaning">${w.m}</div>
          </div>
          <div class="item-actions">
            <button class="mini-btn" onclick="speakWordText('${w.r}')">🔊</button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function filterAllWords() {
      renderAllWordsList(document.getElementById('searchAllInput').value);
    }

    function speakWordText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'ja-JP';
      const voice = getKyokoVoice();
      if (voice) ut.voice = voice;
      window.speechSynthesis.speak(ut);
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        nextSlide();
      } else if (e.code === 'ArrowLeft') {
        prevSlide();
      } else if (e.code === 'KeyS') {
        toggleCurrentFavorite();
      } else if (e.code === 'KeyV') {
        speakCurrentWord(true);
      } else if (e.code === 'KeyA') {
        toggleAutoVoice();
      } else if (e.code === 'Enter' || e.code === 'KeyK') {
        markCurrentAsLearned();
      } else if (e.code === 'KeyH') {
        toggleHideAnswer();
      } else if (e.code === 'KeyF') {
        toggleFullScreen();
      }
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Старт
    saveStorage();
    rebuildDeck();
    startTimer();
  </script>
</body>
</html>
