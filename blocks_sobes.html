<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Японский тренажёр: Собеседование</title>
<style>
  :root {
    --bg-page: #f4f1ea;
    --bg-card: #ffffff;
    --text-main: #2c2c2a;
    --text-muted: #6b6a63;
    --text-faint: #9a988f;
    --border-color: #d3d1c7;
    --border-light: #e5e2d8;
    --accent: #d97757;
    --accent-hover: #c46445;
    --success-bg: #eaf3de;
    --success-border: #97c459;
    --success-text: #2f5a14;
    --error-bg: #fbeae8;
    --error-border: #d97066;
    --error-text: #a32d2d;
    --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-main);
    font-family: var(--font-system);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px 12px 40px;
  }

  #app {
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Header & Navigation */
  header {
    text-align: center;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.01em;
  }

  .nav-blocks {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .nav-btn {
    flex: 1;
    min-width: 82px;
    background: transparent;
    border: 1px solid var(--border-color);
    padding: 8px 6px;
    border-radius: 20px;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    text-align: center;
  }

  .nav-btn:hover {
    border-color: var(--text-muted);
    color: var(--text-main);
  }

  .nav-btn.active {
    background: var(--text-main);
    border-color: var(--text-main);
    color: #fff;
  }

  .nav-btn.mistakes-tab.active {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* Progress Bar */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-bar-bg {
    flex: 1;
    height: 6px;
    background: var(--border-light);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--success-border);
    transition: width 0.3s ease;
    border-radius: 3px;
  }

  .progress-text {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    min-width: 50px;
    text-align: right;
  }

  /* Exercise Card */
  .exercise-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .task-header {
    text-align: center;
  }

  .task-prompt {
    font-size: 1.06rem;
    font-weight: 600;
    line-height: 1.45;
    color: var(--text-main);
  }

  /* Target Slot Area */
  .sentence-slot-area {
    min-height: 64px;
    border: 1.5px dashed var(--border-color);
    background: var(--bg-page);
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .sentence-slot-area.correct {
    border-style: solid;
    border-color: var(--success-border);
    background: var(--success-bg);
  }

  .sentence-slot-area.incorrect {
    border-style: solid;
    border-color: var(--error-border);
    background: var(--error-bg);
  }

  .slot-placeholder {
    color: var(--text-faint);
    font-size: 0.84rem;
    pointer-events: none;
    user-select: none;
    text-align: center;
  }

  /* Word Tiles / Chips */
  .tiles-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    min-height: 80px;
    padding: 4px 0;
  }

  .tile {
    font-family: var(--font-jp);
    font-size: 1.02rem;
    padding: 8px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    color: var(--text-main);
    transition: transform 0.08s ease, background 0.15s, border-color 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1.25;
  }

  .tile:active {
    transform: scale(0.95);
  }

  .tile.in-slot {
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  .sentence-slot-area.correct .tile.in-slot {
    border-color: var(--success-border);
    color: var(--success-text);
  }

  .sentence-slot-area.incorrect .tile.in-slot {
    border-color: var(--error-border);
    color: var(--error-text);
  }

  /* Actions */
  .action-buttons {
    display: flex;
    gap: 8px;
  }

  .btn {
    border: none;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-check {
    flex: 1;
    background: var(--accent);
    color: #fff;
  }

  .btn-check:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .btn-check:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-clear {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    width: 84px;
  }

  .btn-clear:hover:not(:disabled) {
    border-color: var(--text-main);
    color: var(--text-main);
  }

  .btn-clear:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-next {
    width: 100%;
    background: var(--text-main);
    color: #fff;
  }

  .btn-next:hover {
    background: #000000;
  }

  /* Explanation Container */
  .explanation-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .exp-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-light);
  }

  .exp-titles {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .exp-kanji {
    font-family: var(--font-jp);
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.35;
  }

  .exp-kana {
    font-family: var(--font-jp);
    font-size: 1rem;
    color: var(--text-muted);
    line-height: 1.35;
  }

  .exp-ru {
    font-size: 0.95rem;
    color: var(--accent);
    font-weight: 600;
    margin-top: 4px;
  }

  .audio-btn {
    background: var(--bg-page);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s ease;
    color: var(--text-main);
  }

  .audio-btn:hover {
    background: var(--border-light);
    transform: scale(1.05);
  }

  .audio-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .exp-section {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .exp-sec-title {
    font-size: 0.76rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
  }

  .exp-sec-content {
    font-size: 0.88rem;
    line-height: 1.55;
    color: var(--text-main);
    white-space: pre-wrap;
    background: var(--bg-page);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-light);
  }

  .empty-state {
    text-align: center;
    padding: 35px 20px;
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.5;
  }
</style>
</head>

<div id="app">

</div>

const DISTRACTORS = [
  "へ", "私", "あの", "から", "と", "も", "で", "を", "に", "は", "が", "それ", "ここ", "これ",
  "どこ", "友達", "先生", "誰", "いつも", "とても", "あまり", "ちょっと", "そして", "はい", "いいえ"
];

/* ----------------------------------------------------
   APP STATE & CONTROLLER
---------------------------------------------------- */
const STORAGE_KEY = 'blocks_interview_mistakes';

let currentBlock = 1;
let currentShuffledList = [];
let currentIndex = 0;

function loadSavedMistakes() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? new Set(JSON.parse(saved)) : new Set();
  } catch (e) {
    return new Set();
  }
}

let mistakeIds = loadSavedMistakes();

function saveMistakesToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...mistakeIds]));
  } catch (e) {}
}

let currentItem = null;
let placedTiles = [];
let poolTiles = [];
let isChecked = false;

/* Random array shuffler */
function shuffleArray(arr) {
  const res = [...arr];
  for (let i = res.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [res[i], res[j]] = [res[j], res[i]];
  }
  return res;
}

/* Speech synthesis with Kyoko voice preference */
let kyokoVoice = null;
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  const updateVoice = () => {
    try {
      const voices = window.speechSynthesis.getVoices();
      kyokoVoice = voices.find(v => v.name.toLowerCase().includes('kyoko')) ||
                   voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP') ||
                   voices.find(v => v.lang.startsWith('ja')) || null;
    } catch(e) {}
  };
  updateVoice();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = updateVoice;
  }
}
initVoices();

function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.95;
    if (kyokoVoice) utter.voice = kyokoVoice;
    window.speechSynthesis.speak(utter);
  } catch(e) {}
}

function getBlockList(blockNum) {
  if (blockNum === 1) return RAW_DATA.slice(0, 35);
  if (blockNum === 2) return RAW_DATA.slice(35, 70);
  if (blockNum === 3) return RAW_DATA.slice(70, 103);
  if (blockNum === 4) return RAW_DATA.filter(item => mistakeIds.has(item.id));
  return [];
}

function updateMistakeTabBadge() {
  const btn = document.getElementById('tab-4');
  if (btn) btn.textContent = `Ошибки (${mistakeIds.size})`;
}

function switchBlock(blockNum) {
  currentBlock = blockNum;
  
  for (let i = 1; i <= 4; i++) {
    const tab = document.getElementById('tab-' + i);
    if (tab) tab.classList.toggle('active', i === blockNum);
  }

  // При каждом переключении блока перемешиваем вопросы
  currentShuffledList = shuffleArray(getBlockList(currentBlock));
  currentIndex = 0;

  loadQuestion();
}

function loadQuestion() {
  const card = document.getElementById('exercise-card');
  const expContainer = document.getElementById('explanation-container');
  expContainer.innerHTML = '';
  
  if (!currentShuffledList || currentShuffledList.length === 0) {
    currentIndex = 0;
    card.innerHTML = `
      <div class="empty-state">
        ${currentBlock === 4 ? 'В блоке ошибок пока пусто! Ошибитесь в предложении, и оно появится здесь для тренировки.' : 'В этом блоке нет предложений.'}
      </div>
    `;
    updateProgress();
    return;
  }

  if (!document.getElementById('slot-area')) {
    card.innerHTML = `
      <div class="task-header">
        <div class="task-prompt" id="task-prompt"></div>
      </div>
      <div class="sentence-slot-area" id="slot-area"></div>
      <div class="tiles-pool" id="pool-area"></div>
      <div class="action-buttons" id="action-buttons">
        <button class="btn btn-clear" id="btn-clear" onclick="clearSlots()">Сброс</button>
        <button class="btn btn-check" id="btn-check" onclick="checkAnswer()" disabled>Проверить</button>
        <button class="btn btn-next" id="btn-next" onclick="nextQuestion()" style="display: none;">Следующее предложение →</button>
      </div>
    `;
  }

  if (currentIndex >= currentShuffledList.length) {
    currentShuffledList = shuffleArray(getBlockList(currentBlock));
    currentIndex = 0;
  }

  currentItem = currentShuffledList[currentIndex];
  isChecked = false;
  placedTiles = [];

  document.getElementById('task-prompt').textContent = currentItem.ru;

  const slotArea = document.getElementById('slot-area');
  slotArea.className = 'sentence-slot-area';
  
  document.getElementById('btn-clear').style.display = 'inline-flex';
  document.getElementById('btn-check').style.display = 'inline-flex';
  document.getElementById('btn-check').disabled = true;
  document.getElementById('btn-next').style.display = 'none';

  const correctTokens = [...currentItem.tokens];
  const numDistractors = Math.floor(Math.random() * 3) + 1;
  const availableDistractors = DISTRACTORS.filter(d => !correctTokens.includes(d));
  
  const chosenDistractors = [];
  for (let i = 0; i < numDistractors; i++) {
    if (availableDistractors.length > 0) {
      const randIdx = Math.floor(Math.random() * availableDistractors.length);
      chosenDistractors.push(availableDistractors.splice(randIdx, 1)[0]);
    }
  }

  const allTokens = [...correctTokens, ...chosenDistractors];
  for (let i = allTokens.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allTokens[i], allTokens[j]] = [allTokens[j], allTokens[i]];
  }

  poolTiles = allTokens.map((text, idx) => ({ id: 'tile_' + idx, text: text }));
  renderPool();
  renderSlots();
  updateProgress();
}

function renderPool() {
  const poolArea = document.getElementById('pool-area');
  if (!poolArea) return;
  poolArea.innerHTML = '';
  poolTiles.forEach(tile => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';
    btn.textContent = tile.text;
    btn.onclick = () => onPoolTileClick(tile);
    poolArea.appendChild(btn);
  });
}

function renderSlots() {
  const slotArea = document.getElementById('slot-area');
  if (!slotArea) return;
  slotArea.innerHTML = '';
  
  if (placedTiles.length === 0) {
    const span = document.createElement('span');
    span.className = 'slot-placeholder';
    span.textContent = 'Нажимайте на кубики ниже, чтобы составить предложение';
    slotArea.appendChild(span);
    return;
  }

  placedTiles.forEach((tile, index) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile in-slot';
    btn.textContent = tile.text;
    btn.onclick = () => onSlotTileClick(index);
    slotArea.appendChild(btn);
  });
}

function onPoolTileClick(tile) {
  if (isChecked) return;
  speak(tile.text);
  
  const index = poolTiles.findIndex(t => t.id === tile.id);
  if (index !== -1) {
    poolTiles.splice(index, 1);
    placedTiles.push(tile);
    renderPool();
    renderSlots();
    updateButtons();
  }
}

function onSlotTileClick(index) {
  if (isChecked) return;
  const tile = placedTiles.splice(index, 1)[0];
  poolTiles.push(tile);
  renderPool();
  renderSlots();
  updateButtons();
}

function clearSlots() {
  if (isChecked || placedTiles.length === 0) return;
  poolTiles.push(...placedTiles);
  placedTiles = [];
  renderPool();
  renderSlots();
  updateButtons();
}

function updateButtons() {
  const btnCheck = document.getElementById('btn-check');
  const btnClear = document.getElementById('btn-clear');
  if (btnCheck) btnCheck.disabled = placedTiles.length === 0 || isChecked;
  if (btnClear) btnClear.disabled = placedTiles.length === 0 || isChecked;
}

function cleanJp(str) {
  if (!str) return '';
  return str.replace(/[、。！？「」『』\s\.,!?・]/g, '');
}

function checkAnswer() {
  if (isChecked || placedTiles.length === 0) return;
  isChecked = true;

  const slotArea = document.getElementById('slot-area');
  const assembledText = placedTiles.map(t => t.text).join('');
  const cleanTarget = cleanJp(currentItem.kanji);
  const cleanAssembled = cleanJp(assembledText);

  const isCorrect = (cleanAssembled === cleanTarget);

  if (isCorrect) {
    slotArea.classList.add('correct');
    if (mistakeIds.has(currentItem.id)) {
      mistakeIds.delete(currentItem.id);
      saveMistakesToStorage();
      updateMistakeTabBadge();
    }
  } else {
    slotArea.classList.add('incorrect');
    mistakeIds.add(currentItem.id);
    saveMistakesToStorage();
    updateMistakeTabBadge();
  }

  speak(currentItem.kanji);

  document.getElementById('btn-clear').style.display = 'none';
  document.getElementById('btn-check').style.display = 'none';
  const btnNext = document.getElementById('btn-next');
  btnNext.style.display = 'inline-flex';

  renderExplanation();
}

function renderExplanation() {
  const container = document.getElementById('explanation-container');
  const item = currentItem;

  container.innerHTML = `
    <div class="explanation-card">
      <div class="exp-header">
        <div class="exp-titles">
          <div class="exp-kanji">${escapeHtml(item.kanji)}</div>
          <div class="exp-kana">${escapeHtml(item.kana)}</div>
          <div class="exp-ru">${escapeHtml(item.ru)}</div>
        </div>
        <button type="button" class="audio-btn" id="btn-replay-audio" title="Прослушать ещё раз">
          <svg viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>

      <div class="exp-section">
        <div class="exp-sec-title">Лексика собеседования</div>
        <div class="exp-sec-content">${escapeHtml(item.lex)}</div>
      </div>

      <div class="exp-section">
        <div class="exp-sec-title">Грамматика и речевой этикет</div>
        <div class="exp-sec-content">${escapeHtml(item.gram)}</div>
      </div>

      <div class="exp-section">
        <div class="exp-sec-title">Образование форм</div>
        <div class="exp-sec-content">${escapeHtml(item.form)}</div>
      </div>
    </div>
  `;

  document.getElementById('btn-replay-audio').onclick = () => speak(item.kanji);
  container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentShuffledList.length) {
    currentShuffledList = shuffleArray(getBlockList(currentBlock));
    currentIndex = 0;
  }
  loadQuestion();
}

function updateProgress() {
  const bar = document.getElementById('progress-fill');
  const text = document.getElementById('progress-text');
  if (!currentShuffledList || currentShuffledList.length === 0) {
    bar.style.width = '0%';
    text.textContent = '0 / 0';
    return;
  }
  const total = currentShuffledList.length;
  const current = Math.min(currentIndex + 1, total);
  const percent = (current / total) * 100;
  bar.style.width = `${percent}%`;
  text.textContent = `${current} / ${total}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Запуск
updateMistakeTabBadge();
switchBlock(1);
</script>
</body>
</html>
