<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Тренажёры японского языка</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f1ea;
    color: #2c2c2a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }
  .wrap { width: 100%; max-width: 500px; }

  /* Заголовок */
  .header { text-align: center; margin-bottom: 28px; }
  .badge {
    display: inline-block;
    background: #e5e2d8;
    color: #6b6a63;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; color: #2c2c2a; }
  .sub { font-size: 14px; color: #6b6a63; margin: 0; }

  /* Список игр */
  .games-list { display: flex; flex-direction: column; gap: 12px; }
  
  .game-card {
    background: #fff;
    border: 1px solid #d3d1c7;
    border-radius: 18px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .game-card:hover {
    border-color: #ba7055;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(217, 119, 87, 0.12);
  }
  .game-card:active {
    transform: scale(0.98);
  }

  .game-info { display: flex; align-items: center; gap: 16px; }
  .game-icon {
    width: 44px;
    height: 44px;
    background: #fdf5f2;
    border: 1px solid #f0cfc5;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  
  .game-text h2 { font-size: 17px; font-weight: 600; margin: 0; color: #2c2c2a; }

  .play-btn {
    background: #d97757;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrap">
  
  <div class="header">
    <div class="badge">日本語トレーニング</div>
    <h1>Тренажёры японского</h1>
    <p class="sub">Выберите игру</p>
  </div>

  <div class="games-list">
    
    <!-- 1. Антонимы -->
    <a href="antonyms.html" class="game-card">
      <div class="game-info">
        <div class="game-icon">⚖️</div>
        <div class="game-text">
          <h2>Антонимы</h2>
        </div>
      </div>
      <div class="play-btn">Играть →</div>
    </a>

    <!-- 2. Антонимы хирагана -->
    <a href="antonyms_hiragana.html" class="game-card">

      </div>
      <div class="play-btn">Играть →</div>
    </a>

    <!-- 3. Квиз 1 -->
    <a href="quiz1.html" class="game-card">
      <div class="game-info">
        <div class="game-icon">⛩️</div>
        <div class="game-text">
          <h2>Квиз 1</h2>
        </div>
      </div>
      <div class="play-btn">Играть →</div>
    </a>

    <!-- 4. Квиз 2 -->
    <a href="quiz2_with_images.html" class="game-card">

      </div>

    </a>

    <!-- 5. Блоки 1 -->
    <a href="blocks1.html" class="game-card">
      <div class="game-info">
        <div class="game-icon">🗳️</div>
        <div class="game-text">

        </div>
      </div>
      <div class="play-btn">Играть →</div>

    <!-- 6. て-форма -->

    <!-- 7. Блоки Собес -->

        </div>
      </div>
      <div class="play-btn">Играть →</div>
    </a>

    <!-- 8. Глаголяндия -->

      <div class="game-info">
        <div class="game-icon">🏰</div>
        <div class="game-text">

        </div>
      </div>

    </a>

  </div>

</div>
</body>
</html>
